version: '3.8'

networks:
  reguguard-network:
    name: reguguard-network
    driver: bridge

volumes:
  es_data:
    driver: local
  postgres_data:
    driver: local
  airflow_logs:
    driver: local

services:
  # =========================================================================
  # 1. DATABASE LAYER: PostgreSQL (Metadata Store για Airflow & Keycloak)
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: reguguard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-regu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regu_secure_pass_2026}
      POSTGRES_MULTIPLE_DATABASES: "airflow,keycloak"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialization script για να δημιουργηθούν 2 ξεχωριστές βάσεις
      - ./config/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    networks:
      - reguguard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regu_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. SEARCH & STORAGE: Elasticsearch 8.x
  # =========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: reguguard-elasticsearch
    environment:
      - node.name=reguguard-es01
      - cluster.name=reguguard-cluster
      - discovery.type=single-node
      # Για το initial dev/staging απενεργοποιούμε το xpack security SSL
      # ώστε να διευκολύνουμε το initial integration με Spring Data Elasticsearch
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - reguguard-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 5

  # =========================================================================
  # 3. IDENTITY & ACCESS MANAGEMENT (IAM): Keycloak
  # =========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: reguguard-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-regu_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-regu_secure_pass_2026}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secure_2026}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080" # Exposed στο 8180 για να μείνει το 8080 ελεύθερο για το Spring Boot
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reguguard-network

  # =========================================================================
  # 4. ORCHESTRATION: Apache Airflow (Init, Webserver & Scheduler)
  # =========================================================================
  airflow-init:
    image: apache/airflow:2.8.3-python3.10
    container_name: reguguard-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-regu_admin}:${POSTGRES_PASSWORD:-regu_secure_pass_2026}@postgres:5432/airflow
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin_secure_2026}
    networks:
      - reguguard-network

  airflow-webserver:
    image: apache/airflow:2.8.3-python3.10
    container_name: reguguard-airflow-webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-regu_admin}:${POSTGRES_PASSWORD:-regu_secure_pass_2026}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-reguguard_super_secret_signing_key_32b}
    ports:
      - "8088:8080" # Exposed στο 8088
    volumes:
      - ./data-pipeline/dags:/opt/airflow/dags
      - ./data-pipeline/scripts:/opt/airflow/scripts
      - ./mock-data:/opt/airflow/mock-data
      - airflow_logs:/opt/airflow/logs
    networks:
      - reguguard-network

  airflow-scheduler:
    image: apache/airflow:2.8.3-python3.10
    container_name: reguguard-airflow-scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-regu_admin}:${POSTGRES_PASSWORD:-regu_secure_pass_2026}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./data-pipeline/dags:/opt/airflow/dags
      - ./data-pipeline/scripts:/opt/airflow/scripts
      - ./mock-data:/opt/airflow/mock-data
      - airflow_logs:/opt/airflow/logs
    networks:
      - reguguard-network